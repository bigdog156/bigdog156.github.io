<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDSaison Deeplink Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 16px; }
  .inputs {
    background: #fff;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .inputs label {
    display: block;
    font-size: 12px;
    color: #555;
    margin-top: 8px;
  }
  .inputs input {
    width: 100%;
    padding: 10px;
    margin-top: 4px;
    border: 1px solid #d0d0d5;
    border-radius: 8px;
    font-size: 14px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    margin-top: 10px;
    background: #f0f4ff;
    border: 1px solid #d6e0ff;
    border-radius: 8px;
  }
  .toggle-row .label {
    font-size: 13px;
    font-weight: 600;
    color: #1d1d1f;
  }
  .toggle-row .hint {
    font-size: 11px;
    color: #666;
    margin-top: 2px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 26px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #ccc;
    border-radius: 26px;
    transition: .2s;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: .2s;
  }
  .switch input:checked + .slider { background: #34c759; }
  .switch input:checked + .slider:before { transform: translateX(18px); }
  .item {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .item .title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .item .url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: #0066cc;
    word-break: break-all;
    margin-bottom: 10px;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    border: none;
    cursor: pointer;
  }
  .btn-open { background: #0066cc; color: #fff; }
  .btn-intent { background: #34c759; color: #fff; }
  .btn-store { background: #ff9500; color: #fff; }
  .btn-copy { background: #e5e5ea; color: #1d1d1f; }
  .status {
    display: inline-block;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
  }
  .ok { background: #d4f7dc; color: #1a7f37; }
  .warn { background: #fff3cd; color: #8a6d00; }
  .err { background: #fde2e4; color: #b42318; }
</style>
</head>
<body>
  <h1>HDSaison Deeplink Test (Android)</h1>
  <div class="sub">Bấm <b>Mở</b> test scheme, <b>Intent</b> dùng Android intent://, <b>Store</b> tự detect platform → fallback Play Store (Android) hoặc App Store (iOS) nếu chưa cài app.</div>

  <div class="inputs">
    <label>ID đơn (loan id)</label>
    <input id="loanId" value="123456">
    <label>ID thẻ (card id)</label>
    <input id="cardId" value="789">
    <label>ID gói vay (loan-package id)</label>
    <input id="loanPkgId" value="LP001">
    <label>ID gói thẻ (card-package id)</label>
    <input id="cardPkgId" value="CP001">
    <label>VIP code</label>
    <input id="vipCode" value="VIP2026">
    <label>Package name Android (để fallback Play Store)</label>
    <input id="pkgName" value="vn.hdsaison.app" placeholder="vd: vn.hdsaison.app">
    <label>iOS App Store URL (bundle id: com.hdsaison.lending — cần numeric App ID)</label>
    <input id="iosStoreUrl" value="https://apps.apple.com/vn/app/hd-saison/id1589425903" placeholder="vd: https://apps.apple.com/vn/app/id1234567890">

    <div class="toggle-row">
      <div>
        <div class="label">Yêu cầu login (isLogin=true)</div>
        <div class="hint">Bật để tự động thêm <code>isLogin=true</code> vào mọi deeplink</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="isLogin" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div id="list"></div>

<script>
  const items = [
    { t: "1. Danh sách đơn của khách hàng",        u: () => `hdsaison://loans`,                                   note: "ApplicationHistoryScreen" },
    { t: "2. Chi tiết đơn",                        u: v => `hdsaison://loans/${v.loanId}`,                        note: "{applicationId}" },
    { t: "3. Thẻ tín dụng của khách hàng",         u: () => `hdsaison://cards`,                                   note: "UserCreditCardScreen" },
    { t: "4. Chi tiết thẻ tín dụng",               u: v => `hdsaison://cards/${v.cardId}`,                        note: "{id}" },
    { t: "5. Tab Vay tiền mặt — Chọn gói vay",     u: () => `hdsaison://home?tab=cashLoan`,                       note: "Home tab cashLoan" },
    { t: "6. Tab Thẻ tín dụng — Đăng ký mở thẻ",   u: () => `hdsaison://home?tab=creditCard`,                     note: "Home tab creditCard" },
    { t: "7. Tab Vay tiền mặt + VIP code",         u: v => `hdsaison://home?tab=cashLoan&vipCode=${v.vipCode}`,   note: "Auto-fill & search mã VIP" },
    { t: "8. Tab Thẻ tín dụng + VIP code",         u: v => `hdsaison://home?tab=creditCard&vipCode=${v.vipCode}`, note: "Auto-fill & search mã VIP" },
    { t: "9. Simulation sản phẩm vay chỉ định",    u: v => `hdsaison://loan-package/${v.loanPkgId}`,              note: "{packageId} — LoanPackageDetailScreen" },
    { t: "10. Simulation sản phẩm thẻ chỉ định",   u: v => `hdsaison://card-package/${v.cardPkgId}`,              note: "{packageId} — CreditCardDetailScreen" },
  ];

  function vals() {
    return {
      loanId: document.getElementById("loanId").value.trim() || "123",
      cardId: document.getElementById("cardId").value.trim() || "123",
      loanPkgId: document.getElementById("loanPkgId").value.trim() || "LP001",
      cardPkgId: document.getElementById("cardPkgId").value.trim() || "CP001",
      vipCode: document.getElementById("vipCode").value.trim() || "VIP",
      pkgName: document.getElementById("pkgName").value.trim() || "vn.hdsaison.app",
      iosStoreUrl: document.getElementById("iosStoreUrl").value.trim(),
    };
  }

  function detectPlatform() {
    const ua = navigator.userAgent || navigator.vendor || "";
    if (/android/i.test(ua)) return "android";
    if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
    return "other";
  }

  function toItmsApps(httpsUrl) {
    return httpsUrl.replace(/^https?:\/\//, "itms-apps://");
  }

  function openWithStoreFallback(schemeUrl, pkgName, iosStoreUrl) {
    const platform = detectPlatform();
    if (platform === "android") {
      const marketUrl = `market://details?id=${pkgName}`;
      const m = schemeUrl.match(/^hdsaison:\/\/(.*)$/);
      const fallback = encodeURIComponent(marketUrl);
      const intentUrl = m
        ? `intent://${m[1]}#Intent;scheme=hdsaison;package=${pkgName};S.browser_fallback_url=${fallback};end`
        : schemeUrl;
      window.location.href = intentUrl;
      return;
    }
    if (platform === "ios") {
      if (!iosStoreUrl) {
        alert("Vui lòng nhập iOS App Store URL trước (cần numeric App ID).");
        return;
      }
      const nativeStore = toItmsApps(iosStoreUrl);
      const start = Date.now();
      const timer = setTimeout(() => {
        if (Date.now() - start < 2000 && !document.hidden) {
          window.location.href = nativeStore;
        }
      }, 1500);
      window.addEventListener("pagehide", () => clearTimeout(timer), { once: true });
      window.location.href = schemeUrl;
      return;
    }
    alert("Tính năng fallback Store chỉ hoạt động trên Android/iOS. Đang ở: " + (navigator.userAgent || "unknown"));
  }

  function toIntent(url) {
    const m = url.match(/^hdsaison:\/\/(.*)$/);
    if (!m) return url;
    return `intent://${m[1]}#Intent;scheme=hdsaison;end`;
  }

  function withLogin(url, isLogin) {
    if (!isLogin) return url;
    const sep = url.includes("?") ? "&" : "?";
    return `${url}${sep}isLogin=true`;
  }

  function render() {
    const v = vals();
    const isLogin = document.getElementById("isLogin").checked;
    const list = document.getElementById("list");
    list.innerHTML = items.map((it, i) => {
      const url = withLogin(it.u(v), isLogin);
      const intentUrl = toIntent(url);
      return `
        <div class="item">
          <div class="title">${it.t} <span class="status ok">Login</span></div>
          <div class="url" id="url-${i}">${url}</div>
          ${it.note ? `<div style="font-size:12px;color:#666;margin-bottom:8px">${it.note}</div>` : ""}
          <div class="actions">
            <a class="btn btn-open" href="${url}">Mở</a>
            <a class="btn btn-intent" href="${intentUrl}">Intent</a>
            <button class="btn btn-store" data-scheme="${url}" data-pkg="${v.pkgName}" data-ios-store="${v.iosStoreUrl}">Store</button>
            <button class="btn btn-copy" data-url="${url}">Copy</button>
          </div>
        </div>
      `;
    }).join("");

    list.querySelectorAll(".btn-store").forEach(b => {
      b.addEventListener("click", e => {
        e.preventDefault();
        openWithStoreFallback(b.dataset.scheme, b.dataset.pkg, b.dataset.iosStore);
      });
    });

    list.querySelectorAll(".btn-copy").forEach(b => {
      b.addEventListener("click", () => {
        navigator.clipboard.writeText(b.dataset.url);
        b.textContent = "Copied!";
        setTimeout(() => b.textContent = "Copy", 1200);
      });
    });
  }

  document.querySelectorAll(".inputs input").forEach(i => i.addEventListener("input", render));
  document.getElementById("isLogin").addEventListener("change", render);
  render();
</script>
</body>
</html>
