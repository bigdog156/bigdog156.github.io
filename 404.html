<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang mở HD SAISON…</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff6b00 0%, #ff9500 100%);
    color: #1d1d1f;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #555; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  .btn {
    display: inline-block;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    background: #ff6b00;
    color: #fff;
    width: 100%;
    margin-top: 8px;
  }
  .btn.secondary { background: #f0f0f5; color: #1d1d1f; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #f0f0f5;
    border-top-color: #ff6b00;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1 id="title">Đang mở HD SAISON…</h1>
    <p id="msg">Vui lòng đợi trong giây lát.</p>
    <div id="fallback" style="display:none">
      <a class="btn" href="/">Về trang chủ</a>
    </div>
  </div>

<script>
  // GitHub Pages serves this file (404.html) for ANY path that has no matching
  // file, while keeping the original URL in the address bar. Universal Links /
  // App Links (e.g. /home?tab=cashLoan, /loans/123, /loan-package/LP001) fall
  // back to these web URLs when the app isn't installed — which would otherwise
  // show GitHub's default 404. Here we turn a known HD SAISON path into a
  // hdsaison:// deeplink and hand it to the existing open/fallback page.

  // Paths that map to the HD SAISON app (must match .well-known/apple-app-site-association)
  const APP_PREFIXES = ["loans", "cards", "home", "loan-package", "card-package"];

  const path = location.pathname.replace(/^\/+/, ""); // strip leading slash(es)
  const firstSeg = path.split("/")[0];

  if (APP_PREFIXES.includes(firstSeg)) {
    // Rebuild the deeplink: hdsaison://<path><?query>
    const deeplink = "hdsaison://" + path + location.search;
    location.replace("/hdsaison-open.html?to=" + encodeURIComponent(deeplink));
  } else {
    // Genuine not-found path — don't bounce the user to the app store.
    document.getElementById("title").textContent = "Không tìm thấy trang";
    document.getElementById("msg").textContent = "Đường dẫn bạn truy cập không tồn tại.";
    document.querySelector(".spinner").style.display = "none";
    document.getElementById("fallback").style.display = "block";
  }
</script>
</body>
</html>
